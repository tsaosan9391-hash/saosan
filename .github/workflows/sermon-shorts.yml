# 설교 쇼츠 재료 준비
#
# shorts/request.json 을 바꿔 올리면 유튜브에서 설교 영상을 받아
# 받아쓰기·구간 잘라내기를 하고, 결과를 shorts/output/ 에 다시 올립니다.
# (작업 환경에서는 유튜브에 바로 접속할 수 없어 여기서 대신 처리합니다)
name: 설교 쇼츠 재료 준비

on:
  push:
    branches-ignore: [main]
    paths: [shorts/request.json, shorts/input/**, scripts/shorts/job.py, .github/workflows/sermon-shorts.yml]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sermon-shorts-${{ github.ref }}
  cancel-in-progress: true

jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # 유튜브에서 영상을 받으려면 자바스크립트 실행기가 필요합니다
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: 도구 설치
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
          pip install -q "yt-dlp[default]" faster-whisper gdown bgutil-ytdlp-pot-provider

      # 유튜브의 '로봇 확인'을 통과하는 데 필요한 인증 토큰(PO 토큰)을 만들어 주는 도우미
      - name: 토큰 도우미 띄우기
        run: docker run -d --name bgutil -p 4416:4416 --init brainicism/bgutil-ytdlp-pot-provider

      - name: 영상 받기·받아쓰기
        env:
          YT_COOKIES: ${{ secrets.YT_COOKIES }}
        run: python scripts/shorts/job.py

      - name: 결과 올리기
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add shorts/output
          git commit -m "설교 쇼츠 재료 ($(jq -r .mode shorts/request.json))" || exit 0
          git pull --rebase
          git push
