# 유튜브 영상 목록 사본을 매일 갱신합니다.
#
# 홈페이지를 만들 때 유튜브가 응답하지 않으면 이 사본을 대신 씁니다.
# 사본이 없으면 영상 영역이 통째로 비어 버리기 때문입니다.
#
# 여기(GitHub)에서 가져오는 것은 클라우드플레어에서 가져오는 것보다
# 훨씬 안정적이라, 새 영상 반영도 겸해서 처리됩니다.
# (사본이 바뀌면 커밋이 생기고, 그러면 홈페이지도 다시 만들어집니다)
name: 영상 목록 사본 갱신

on:
  schedule:
    # 매일 한국시간 오전 6시 (UTC 21:00)
    - cron: "0 21 * * *"
  # 필요할 때 손으로도 돌릴 수 있게
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-video-cache
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: 유튜브에서 목록 가져오기
        run: node scripts/update-video-cache.mjs

      - name: 바뀐 내용이 있으면 저장
        run: |
          if git diff --quiet -- site/src/data/videos-cache.json; then
            echo "바뀐 내용이 없어 그대로 둡니다."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add site/src/data/videos-cache.json
          git commit -m "영상 목록 사본 갱신"
          git push
